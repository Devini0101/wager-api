version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wager_postgres
    environment:
      POSTGRES_USER: wager_user
      POSTGRES_PASSWORD: wager_password
      POSTGRES_DB: wager_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager_user -d wager_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: wager_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
      - EDGE_PORT=4566
    volumes:
      # pra executar o script de inicialização das filas automaticamente
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh

volumes:
  pgdata: